version: "3.9"

services:
  # =====================================================
  # PostgreSQL Database (Local Development)
  # =====================================================
  postgres:
    image: postgres:15-alpine
    container_name: ai4mind-postgres
    environment:
      POSTGRES_DB: ai4mind_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai4mind-network

  # =====================================================
  # Redis Cache & Session Store
  # =====================================================
  redis:
    image: redis:7-alpine
    container_name: ai4mind-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai4mind-network

  # =====================================================
  # AI-Service (API Gateway)
  # =====================================================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ai4mind-api-gateway
    ports:
      - "8000:8000"
    environment:
      # Database
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/ai4mind_dev
      # Redis
      - REDIS_URL=redis://redis:6379/0
      # Services
      - VOICE_SERVICE_URL=http://voice-analysis:8001
      # JWT
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev_secret_key_change_in_production}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      # Gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-1.5-flash
      # App
      - ENVIRONMENT=development
      - DEBUG=True
      - LOG_LEVEL=INFO
    volumes:
      - ./ai-service:/app
      - ./shared:/app/shared
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - ai4mind-network

  # =====================================================
  # Voice Analysis Microservice
  # =====================================================
  voice-analysis:
    build:
      context: ./voice-analysis
      dockerfile: Dockerfile
    container_name: ai4mind-voice-service
    ports:
      - "8001:8001"
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - LOG_LEVEL=INFO
      - MODEL_PATH=/app/models
    volumes:
      - ./voice-analysis:/app
      - ./shared:/app/shared
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    networks:
      - ai4mind-network

  # =====================================================
  # Frontend (React + Vite)
  # =====================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai4mind-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_APP_NAME=AI4Mind
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host
    networks:
      - ai4mind-network

# =====================================================
# Volumes
# =====================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# =====================================================
# Networks
# =====================================================
networks:
  ai4mind-network:
    driver: bridge

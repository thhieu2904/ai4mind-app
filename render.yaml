# ==================================================
# AI4Mind - Render Blueprint (HYBRID VOICE SERVICE)
# ==================================================
# Updated: 2025-10-06 - Voice service với Hybrid architecture
# Architecture: Deepgram API (transcription) + Custom ML (emotion)
# Memory: <512MB (deployable on free tier!) ✅

services:
  # ==================================================
  # AI Service (API Gateway)
  # ==================================================
  - type: web
    name: ai4mind-ai-service
    runtime: python
    region: singapore
    plan: free

    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    rootDir: ai-service

    healthCheckPath: /health

    envVars:
      # Database (Supabase)
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_PROJECT_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # AI Service
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash

      # JWT & Security
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7

      # Microservices (will auto-populate)
      - key: VOICE_SERVICE_URL
        fromService:
          type: web
          name: ai4mind-voice-service
          envVarKey: RENDER_EXTERNAL_URL

      # Frontend & CORS (update after frontend deploy)
      - key: FRONTEND_URL
        value: http://localhost:3000
      - key: CORS_ORIGINS
        value: http://localhost:3000,https://ai4mind.vercel.app

      # Application
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: False
      - key: LOG_LEVEL
        value: INFO

  # ==================================================
  # Voice Service (Audio Analysis) - HYBRID ✅
  # ==================================================
  - type: web
    name: ai4mind-voice-service
    runtime: python
    region: singapore
    plan: free # NOW DEPLOYABLE! (memory optimized)

    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    rootDir: voice-service

    healthCheckPath: /health

    # Disk for audio file storage
    disk:
      name: voice-storage
      mountPath: /app/storage
      sizeGB: 1

    envVars:
      # Database
      - key: DATABASE_URL
        sync: false

      # AI Service URL (auto-populated)
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: ai4mind-ai-service
          envVarKey: RENDER_EXTERNAL_URL

      # Deepgram API (REQUIRED for Hybrid architecture)
      - key: DEEPGRAM_API_KEY
        sync: false # Set manually - Get from https://console.deepgram.com

      - key: TRANSCRIPTION_SERVICE
        value: deepgram # "deepgram" or "whisper" (whisper not deployable!)

      # Server
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: $PORT

      # File Storage
      - key: FILE_STORAGE_PATH
        value: /app/storage/audio
      - key: MAX_FILE_SIZE_MB
        value: 10

      # Processing (CUSTOM ML - our unique value!)
      - key: ENABLE_EMOTION_DETECTION
        value: true
      - key: ENABLE_TEXT_ANALYSIS
        value: true

      # Application
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO

        # ==================================================
        # HYBRID ARCHITECTURE NOTES
        # ==================================================
        # Voice service now uses:
        #   1. Deepgram API → Transcription (external, lightweight)
        #   2. Librosa → Audio feature extraction (local)
        #   3. Custom ML → Emotion detection (local, our IP!)
        #
        # Benefits:
        #   ✅ Build size: 150MB (vs 500MB with Whisper)
        #   ✅ Memory usage: <512MB (fits free tier!)
        #   ✅ Keeps custom emotion ML (competitive advantage)
        #   ✅ Production-grade transcription quality
        #
        # Requirements:
        #   - DEEPGRAM_API_KEY (free 12,000 min/month)
        #   - See .secrets/HYBRID_VOICE_DEPLOY.md for setup
        # ==================================================
        fromService:
          type: web
          name: ai4mind-ai-service
          envVarKey: RENDER_EXTERNAL_URL

      # Server
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: $PORT

      # File Storage
      - key: FILE_STORAGE_PATH
        value: /app/storage/audio
      - key: MAX_FILE_SIZE_MB
        value: 10

      # Whisper
      - key: WHISPER_MODEL
        value: base

      # Processing
      - key: ENABLE_EMOTION_DETECTION
        value: true
      - key: ENABLE_TEXT_ANALYSIS
        value: true

      # Application
      - key: ENVIRONMENT
        value: production

# ==================================================
# AI4Mind - Render Blueprint (AI SERVICE ONLY)
# ==================================================
# Temporary config: Deploy only AI service
# Voice service will be added later when memory issue is resolved

services:
  # ==================================================
  # AI Service (API Gateway) - MAIN SERVICE
  # ==================================================
  - type: web
    name: ai4mind-ai-service
    runtime: python
    region: singapore
    plan: free

    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    rootDir: ai-service

    healthCheckPath: /health

    envVars:
      # Database (Supabase)
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_PROJECT_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # AI Service
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash

      # JWT & Security
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7

      # Microservices (voice service disabled for now)
      - key: VOICE_SERVICE_URL
        value: "" # Empty = disabled

      # Frontend & CORS (update after frontend deploy)
      - key: FRONTEND_URL
        value: http://localhost:3000
      - key: CORS_ORIGINS
        value: http://localhost:3000,https://ai4mind.vercel.app

      # Application
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: False
      - key: LOG_LEVEL
        value: INFO
# ==================================================
# Voice Service - TEMPORARILY DISABLED
# ==================================================
# Reason: Out of memory during build (512MB limit)
# Solutions:
#   1. Use external API (Deepgram, AssemblyAI)
#   2. Upgrade to Standard plan ($25/month)
#   3. Run voice service locally
#
# See: .secrets/VOICE_SERVICE_OPTIONS.md for details
# ==================================================
